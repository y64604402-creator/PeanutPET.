<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ピーナッツ育成</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@500;700;800&display=swap');

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: url("peanut_bg.png");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    font-family: 'Nunito', sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  body { display: flex; align-items: center; justify-content: center; padding: 20px 12px; }

  .pg-card {
    width: 100%;
    max-width: 440px;
    background: linear-gradient(180deg, #2c2333 0%, #241c2c 100%);
    border-radius: 28px;
    border: 1px solid rgba(245, 203, 31, 0.15);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    padding: 18px 18px 24px;
    position: relative;
    overflow: hidden;
  }
  .pg-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; }
  .pg-name { font-family: 'Baloo 2', cursive; font-size: 21px; font-weight: 700; color: #F3EEE4; }
  .pg-meta-group { display: flex; align-items: center; gap: 10px; }
  .pg-money { font-size: 19px; font-weight: 800; color: #F5CB1F; display: flex; align-items: center; gap: 3px; }
  .coin-icon { width: 1.1em; height: 1.1em; vertical-align: -0.15em; object-fit: contain; }
  .pg-lv-group { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .pg-meta { font-size: 12px; color: #B7A8C0; font-weight: 700; }
  .pg-exp-track { width: 46px; height: 4px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .pg-exp-fill { height: 100%; background: #F2C14E; border-radius: 3px; transition: width 0.4s ease; }

  /* ---------- ROOM ---------- */
  .room {
    position: relative;
    width: 100%;
    aspect-ratio: 1402 / 1122;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.25);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    background-color: #1a1420;
  }
  .room-bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: fill;
    display: block;
  }

  .poop {
    position: absolute; font-size: 22px; cursor: pointer;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,0.35));
    transform: translate(-50%, -50%);
    animation: pg-pop 0.3s ease;
  }
  @keyframes pg-pop { from { transform: translate(-50%,-50%) scale(0); } to { transform: translate(-50%,-50%) scale(1); } }

  .pet-anchor {
    position: absolute;
    width: 15%;
    transform: translate(-50%, -100%);
    transition: left 0.45s linear, top 0.45s linear, width 0.4s ease, transform 0.4s ease;
    z-index: 10;
  }
  .pet-anchor.lying { width: 28%; transform: translate(-50%, -50%); }
  .companion-anchor { width: 9%; z-index: 8; }
  .pet-anchor.habubu-zoom { width: 20%; }
  .pet-anchor.gummy-zoom { width: 17%; }
  .pet-anchor.landed-zoom { width: 19%; }
  .pet-anchor.no-transition, .pet-anchor.no-transition .pet-scale { transition: none !important; }
  .pet-anchor.lying .zzz-float { left: 20%; bottom: 88%; }
  .pet-anchor.lying .bubble-emote { left: 20%; }
  .pet-scale {
    transition: transform 0.45s ease;
    transform-origin: 50% 100%;
  }
  .pet-bump { transition: transform 0.12s ease; }
  .pet-bump.bump { animation: pg-bump 0.4s ease; }
  @keyframes pg-bump { 0% { transform: scale(1);} 30% { transform: scale(1.1) translateY(-10%);} 100% { transform: scale(1);} }
  .pet-sprite { width: 100%; display: block; filter: drop-shadow(0 5px 6px rgba(0,0,0,0.4)); cursor: pointer; }
  .pet-sprite.nudge-left { transform: translateX(-12%); }

  /* ---------- jump / splat gag ---------- */
  .splat-overlay {
    position: absolute; inset: 0; z-index: 900;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; pointer-events: none;
  }
  .splat-overlay img {
    width: 82%;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45));
    transform: translateY(0);
  }
  .splat-overlay.falling img {
    transition: transform 1s cubic-bezier(0.55, 0, 1, 1);
    transform: translateY(170%);
  }

  .dialogue-box {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%) scale(0.9);
    width: 160px; background: #fff; color: #241c2c; border-radius: 14px;
    padding: 10px 12px 8px; box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease, left 0.2s ease, top 0.2s ease;
    z-index: 500; cursor: pointer;
  }
  .dialogue-box.show { opacity: 1; transform: translate(-50%, -100%) scale(1); pointer-events: auto; }
  .dialogue-box::after {
    content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 7px solid transparent; border-top-color: #fff;
  }
  .dialogue-text { font-size: 12px; font-weight: 700; line-height: 1.5; }
  .dialogue-input-row { display: flex; gap: 6px; margin-top: 6px; }
  .dialogue-input {
    flex: 1; min-width: 0; padding: 6px 8px; border-radius: 8px;
    border: 1px solid #ccc; font-size: 12px; font-weight: 700; color: #241c2c;
    outline: none; font-family: 'Nunito', sans-serif;
  }
  .dialogue-confirm {
    flex-shrink: 0; padding: 6px 10px; border-radius: 8px; border: none;
    background: #F5CB1F; color: #241c2c; font-size: 11px; font-weight: 800; cursor: pointer;
  }
  .dialogue-next {
    text-align: right; font-size: 10px; color: #b8a8a8; margin-top: 2px;
    animation: dialogue-bounce 1s ease-in-out infinite;
  }
  @keyframes dialogue-bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2px); } }

  .bubble-emote {
    position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%);
    background: #fff; border-radius: 999px; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.25s ease;
    margin-bottom: 4px;
  }
  .bubble-emote::after {
    content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: #fff;
  }
  .bubble-emote.show { opacity: 1; }

  .zzz-float {
    position: absolute; left: 62%; bottom: 92%; font-family: 'Baloo 2', cursive; color: #fff;
    font-size: 15px; opacity: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.4);
  }
  .coffin-zzz-wrap { position: absolute; z-index: 200; transform: translateX(-50%); }
  .coffin-zzz-wrap .zzz-float { position: static; display: inline-block; }
  .zzz-float.show { animation: pg-float 2.2s ease-in-out infinite; }
  @keyframes pg-float { 0% { transform: translateY(0); opacity:0.15;} 50% { transform: translateY(-16px); opacity:0.95;} 100% { transform: translateY(-30px); opacity:0;} }

  .menu-toggle {
    position: absolute; top: 8px; right: 8px; z-index: 350;
    padding: 7px 12px; border-radius: 999px;
    background: rgba(20,14,26,0.75); border: 1px solid rgba(245,203,31,0.4);
    color: #F3EEE4; font-family: 'Baloo 2', cursive; font-size: 12px; font-weight: 700;
    letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 4px;
    cursor: pointer; backdrop-filter: blur(2px);
  }
  .menu-toggle.active { background: #F5CB1F; border-color: #E0B300; color: #241c2c; }

  .eye-toggle {
    position: absolute; top: 8px; left: 8px; z-index: 350;
    width: 30px; height: 30px; padding: 0; border-radius: 999px;
    background: rgba(20,14,26,0.75); border: 1px solid rgba(245,203,31,0.4);
    color: #F3EEE4; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(2px);
  }
  .peek-overlay { position: absolute; inset: 0; z-index: 400; cursor: pointer; }

  .menu-panel {
    position: absolute; top: 46px; right: 8px; z-index: 350;
    display: flex; flex-direction: column; gap: 6px;
    opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .menu-panel.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .menu-panel button {
    padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(245,203,31,0.4);
    background: rgba(20,14,26,0.85); color: #F3EEE4; font-weight: 800; font-size: 11.5px;
    cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap;
    backdrop-filter: blur(2px);
  }
  .menu-panel button:hover { background: rgba(245,203,31,0.25); }

  .drag-highlight {
    position: absolute; box-sizing: border-box;
    background: rgba(214, 40, 79, 0.35);
    border: 2px solid rgba(214, 40, 79, 0.9);
    border-radius: 6px;
    pointer-events: none;
    z-index: 200;
    display: none;
  }
  .drag-highlight.show { display: block; }

  .drag-ghost {
    position: fixed; pointer-events: none; z-index: 1000;
    width: 64px; transform: translate(-50%, -50%);
    opacity: 0.85; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4));
    display: none;
  }
  .drag-ghost.show { display: block; }
  .drag-ghost img { width: 100%; display: block; }

  .furn-item {
    position: absolute; transform: translate(-50%, -100%);
    pointer-events: none;
  }
  .furn-item img { width: 100%; display: block; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.35)); -webkit-user-drag: none; user-drag: none; -webkit-touch-callout: none; }
  .edit-mode .furn-item {
    pointer-events: auto; cursor: pointer;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .furn-item[data-item-id="tv"], .furn-item[data-item-id="toya_desk"], .furn-item[data-item-id="record_player"], .furn-item[data-item-id="record_player_toya"], .furn-item[data-item-id="roomlight"] { pointer-events: auto; cursor: pointer; }
  .farm-plot {
    position: absolute; width: 11%; transform: translate(-50%, -50%);
    cursor: pointer; z-index: 20;
  }
  .farm-plot img { width: 100%; display: block; }
  .farm-plot .empty-marker {
    width: 60%; height: 60%; margin: 20%; border: 2px dashed rgba(255,255,255,0.35);
    border-radius: 50%;
  }
  .farm-plot .plot-lock {
    width: 100%; aspect-ratio: 1; border-radius: 50%; background: rgba(0,0,0,0.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; gap: 2px;
  }
  .farm-plot .plot-lock span { font-size: 9px; font-weight: 800; color: #ffd35c; }
  .farm-plot-timer {
    position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%);
    font-size: 9px; font-weight: 800; color: #fff; background: rgba(0,0,0,0.55);
    padding: 1px 5px; border-radius: 999px; white-space: nowrap;
  }
  .edit-mode .furn-item:hover img { filter: drop-shadow(0 4px 4px rgba(0,0,0,0.35)) brightness(0.85); }

  .furn-tray {
    margin-top: 10px; padding: 10px; border-radius: 14px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    display: flex; gap: 8px; overflow-x: auto;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .furn-tray.drag-over { background: rgba(245,203,31,0.15); border-color: rgba(245,203,31,0.5); }
  .furn-wallpaper-picker {
    margin-top: 10px; padding: 10px; border-radius: 14px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    overflow-x: auto; flex-wrap: nowrap;
  }
  .furn-cat-tabs { margin-top: 10px; display: flex; gap: 8px; }
  .furn-cat-tab {
    flex: 1; padding: 8px 4px; border-radius: 10px; text-align: center;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    color: #cfc2d8; font-size: 12px; font-weight: 800; cursor: pointer;
  }
  .furn-cat-tab.active { background: #ffd35c; color: #3a2b12; border-color: #ffd35c; }
  .furn-chip {
    flex-shrink: 0; width: 60px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03); cursor: grab; color: #cfc2d8; font-size: 9.5px; font-weight: 800;
    touch-action: pan-x; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .furn-chip img { width: 100%; display: block; pointer-events: none; -webkit-user-drag: none; user-drag: none; }
  .furn-chip.pressed { border-color: #F5CB1F; background: rgba(245,203,31,0.15); }
  .furn-hint { font-size: 10.5px; color: #cfc2d8; text-align: center; margin-top: 2px; }
  .food-tray {
    margin-top: 10px; padding: 10px; border-radius: 14px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    display: flex; gap: 8px; overflow-x: auto;
  }
  .food-chip {
    flex-shrink: 0; width: 60px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03); cursor: pointer; color: #cfc2d8; font-size: 9.5px; font-weight: 800;
    text-align: center;
  }
  .food-chip img { width: 100%; display: block; pointer-events: none; }

  .shop-screen {
    background: linear-gradient(180deg, #2c2140 0%, #1c1526 100%);
    display: flex; flex-direction: column; padding: 46px 14px 14px;
    aspect-ratio: auto; max-height: 78vh; min-height: 420px;
  }
  .shop-screen-title {
    font-family: 'Baloo 2', cursive; font-size: 18px; color: #F3EEE4;
    text-align: center; margin-bottom: 10px;
  }
  .shop-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

  #gachaScreen {
    position: fixed; inset: 0; width: 100vw; height: 100vh; aspect-ratio: auto;
    border-radius: 0; border: none; box-shadow: none; background: #000; z-index: 1000;
  }
  .gacha-bg-img { object-fit: cover; }
  .gacha-panel {
    position: absolute; left: 0; right: 0; bottom: 6%; display: flex; flex-direction: column;
    align-items: center; gap: 10px; z-index: 20;
  }
  .gacha-cost { font-size: 14px; color: #ffd35c; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
  .gacha-result { font-size: 15px; font-weight: 800; color: #fff; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }

  .gacha-capsule { position: absolute; left: 50%; top: 42%; width: 64px; height: 64px; z-index: 25; transform: translate(-50%, -300%); }
  .gacha-capsule.dropping { animation: capsuleDrop 0.9s cubic-bezier(.36,0,.66,1.4) forwards; }
  .capsule-half {
    position: absolute; left: 0; width: 64px; height: 32px; transition: transform 0.45s ease, opacity 0.45s ease;
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.15);
  }
  .capsule-top { top: 0; background: linear-gradient(180deg,#ff8a8a,#e74c3c); border-radius: 32px 32px 0 0; }
  .capsule-bottom { bottom: 0; background: linear-gradient(180deg,#eaf6ff,#cfe8f7); border-radius: 0 0 32px 32px; }
  .gacha-capsule.opened .capsule-top { transform: translateY(-46px) rotate(-35deg); opacity: 0; }
  .gacha-capsule.opened .capsule-bottom { transform: translateY(46px) rotate(35deg); opacity: 0; }
  .capsule-prize {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 900; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    opacity: 0; transform: scale(0.4); transition: opacity 0.3s ease 0.3s, transform 0.3s ease 0.3s;
  }
  .gacha-capsule.opened .capsule-prize { opacity: 1; transform: scale(1.3); }
  @keyframes capsuleDrop {
    0% { transform: translate(-50%, -300%); }
    55% { transform: translate(-50%, 20%); }
    75% { transform: translate(-50%, -8%); }
    90% { transform: translate(-50%, 3%); }
    100% { transform: translate(-50%, 0%); }
  }
  .gacha-bg-img.gacha-shake { animation: gachaShake 0.4s ease; }
  @keyframes gachaShake {
    0%, 100% { transform: rotate(0) translateX(0); }
    25% { transform: rotate(-1.2deg) translateX(-3px); }
    75% { transform: rotate(1.2deg) translateX(3px); }
  }

  .settings-form { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
  .settings-label { font-size: 11.5px; color: #cfc2d8; font-weight: 800; margin-top: 4px; }
  .wallpaper-picker { display: flex; flex-wrap: wrap; gap: 8px; }
  .wallpaper-chip {
    width: 64px; border-radius: 10px; overflow: hidden; cursor: pointer;
    border: 2px solid transparent; background: #2a2135; text-align: center;
  }
  .wallpaper-chip.active { border-color: #ffd35c; }
  .wallpaper-chip img { width: 100%; height: 44px; object-fit: cover; display: block; }
  .wallpaper-chip span { display: block; font-size: 9px; color: #e7dcee; padding: 2px 0; }
  .settings-input { width: 100%; box-sizing: border-box; margin-bottom: 4px; }
  #settingsSaveBtn { margin-top: 12px; }
  .shop-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px; border-radius: 12px; background: rgba(255,255,255,0.05);
  }
  .shop-item .icon {
    width: 48px; height: 48px; flex-shrink: 0; border-radius: 8px;
    background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .shop-item .icon img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; -webkit-user-drag: none; user-drag: none; }
  .shop-section-title { font-size: 13px; font-weight: 800; color: #ffd35c; margin: 14px 0 4px; }
  .shop-hint { font-size: 11px; color: #b8aec0; margin: 2px 0 10px; opacity: 0.85; }
  .shop-item-note { font-size: 10.5px; color: #ffd35c; font-weight: 700; margin-top: 1px; }
  .inventory-empty { font-size: 11px; color: #8d8494; padding: 4px 2px 8px; }
  .shop-item .info { flex: 1; min-width: 0; }
  .shop-item .name { font-size: 12.5px; font-weight: 800; color: #F3EEE4; }
  .shop-item .price { font-size: 11.5px; color: #F5CB1F; font-weight: 700; }
  .shop-item .buy-btn {
    flex-shrink: 0; padding: 7px 14px; border-radius: 999px; border: none;
    background: #F5CB1F; color: #241c2c; font-weight: 800; font-size: 11.5px; cursor: pointer;
  }
  .shop-item .buy-btn:disabled { background: rgba(255,255,255,0.15); color: #8d8494; cursor: default; }

  .pg-stats { margin-top: 14px; display: grid; gap: 8px; }
  .pg-payout-timer {
    margin-top: 8px; text-align: center; font-size: 11.5px; font-weight: 800;
    color: #ffd35c; background: rgba(255,255,255,0.05); border-radius: 999px; padding: 6px 10px;
  }
  .pg-stat { display: flex; align-items: center; gap: 10px; }
  .pg-stat-label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: #cfc2d8; width: 66px; flex-shrink: 0; }
  .pg-stat-icon { width: 16px; height: 16px; object-fit: contain; flex-shrink: 0; vertical-align: middle; margin-bottom: 2px; }
  .pg-stat-track { flex: 1; height: 9px; border-radius: 6px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .pg-stat-fill { height: 100%; border-radius: 6px; transition: width 0.6s ease; }
  .pg-actions { margin-top: 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
  .pg-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 4px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04); color: #F3EEE4; font-weight: 800; font-size: 11px;
    cursor: pointer; transition: transform 0.15s ease, background 0.15s ease;
  }
  .pg-btn:hover { background: rgba(255,255,255,0.09); transform: translateY(-1px); }
  .pg-btn:active { transform: translateY(0) scale(0.96); }
  .pg-btn.sleep { background: rgba(74,133,176,0.18); border-color: rgba(74,133,176,0.4); }
  .pg-btn span.ic { font-size: 18px; }
  .pg-btn .ic-img { width: 18px; height: 18px; object-fit: contain; display: block; }

  .pg-toast {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(20,14,26,0.92); border: 1px solid rgba(245,203,31,0.35); color: #F3EEE4;
    padding: 6px 13px; border-radius: 999px; font-size: 12px; font-weight: 800;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4); z-index: 20; white-space: nowrap; opacity: 0; transition: opacity 0.2s ease;
  }
  .pg-toast.show { opacity: 1; }

  .pg-intro { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .pg-intro img { width: 140px; filter: drop-shadow(0 10px 18px rgba(0,0,0,0.5)); }

  .pg-input {

  .qty-modal-count { font-size: 22px; font-weight: 800; color: #F3EEE4; min-width: 40px; }
  .qty-modal-cost { font-size: 13px; color: #F5CB1F; font-weight: 700; margin-bottom: 16px; }

    position: absolute; top: 50%; transform: translateY(-50%); z-index: 300;

    const maxLevel = Math.max(...Object.keys(WORK_LEVEL_TABLE).map(Number));
    for (let lvl = 1; lvl <= maxLevel; lvl++) {

    let level = 1, cum = 0;

      const need = xpNeededForLevel(level);

  const SCENES = {

  const GRID_SIZE = 6; // 6 x 6, shared by every scene

  // project a raw (u, v) grid-fraction point (0..1 each) to scene percent coordinates
  function projectUV(scene, u, v) {
    const s = SCENES[scene];
    const backX = s.BACK_L + (s.BACK_R - s.BACK_L) * u;
    const frontX = s.FRONT_L + (s.FRONT_R - s.FRONT_L) * u;
    const x = backX + (frontX - backX) * v;
    const y = s.BACK_Y + (s.FRONT_Y - s.BACK_Y) * v;
    return { x, y };
  }

  function projectGridIn(scene, col, row) {
    const s = SCENES[scene];
    const u = (col + 0.5) / GRID_SIZE;
    const v = (row + 0.5) / GRID_SIZE;
    const { x, y } = projectUV(scene, u, v);
    const backW = s.BACK_R - s.BACK_L;
    const frontW = s.FRONT_R - s.FRONT_L;
    const widthRatio = (backW + (frontW - backW) * v) / frontW;
    const scale = 0.78 + (widthRatio - backW / frontW) / (1 - backW / frontW) * 0.22;
    return { xPct: x * 100, yPct: y * 100, scale: Math.max(0.78, Math.min(1, scale)) };
  }

  // footprint (bounding box) in room percent for an item anchored at top-left cell (col,row)
  // spanning wCells x hCells. Returns center-x, bottom-y, and pixel width/height percentages.
  function projectFootprint(col, row, wCells, hCells) {
    const u0 = col / GRID_SIZE, u1 = (col + wCells) / GRID_SIZE;
    const v0 = row / GRID_SIZE, v1 = (row + hCells) / GRID_SIZE;
    const uCenter = (u0 + u1) / 2, vCenter = (v0 + v1) / 2;
    const centerPt = projectUV("home", uCenter, vCenter);
    const s = SCENES.home;
    const backW = s.BACK_R - s.BACK_L;
    const frontW = s.FRONT_R - s.FRONT_L;
    // width computed from the depth at the footprint's vertical center, not from a bounding
    // box of all 4 projected corners -- the naive bounding-box approach has an artifact where
    // the left/back and right/front edges cross near the middle column, making items there
    // appear artificially narrower than items nearer the left/right edges of the room.
    const widthFrac = (backW + (frontW - backW) * vCenter) * (wCells / GRID_SIZE);
    const corners = [
      projectUV("home", u0, v0), projectUV("home", u1, v0),
      projectUV("home", u0, v1), projectUV("home", u1, v1),
    ];
    const ys = corners.map((p) => p.y);
    const yMin = Math.min(...ys), yMax = Math.max(...ys);
    return {
      centerXPct: centerPt.x * 100,
      bottomYPct: yMax * 100,
      topYPct: yMin * 100,
      widthPct: widthFrac * 100,
    };
  }

      d.setDate(d.getDate() - 1);

  // find the grid cell whose projected center is nearest a given room-relative point (0..1 fractions)
  function nearestCell(px, py) {
    let best = { col: 0, row: 0 }, bestDist = Infinity;
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const p = projectGrid(c, r);
        const dx = p.xPct / 100 - px;
        const dy = p.yPct / 100 - py;
        const d = dx * dx + dy * dy;
        if (d < bestDist) { bestDist = d; best = { col: c, row: r }; }
      }
    }
    return best;
  }

  function footprintCells(item, col, row) {
    const cells = [];
    for (let r = 0; r < item.hCells; r++) {
      for (let c = 0; c < item.wCells; c++) cells.push(col + c + "," + (row + r));
    }
    return cells;
  }

  function isCellOccupied(c, r) {
    return furniture.some((f) => {
      const def = FURN_BY_ID[f.id];
      return footprintCells(def, f.col, f.row).includes(c + "," + r);
    });
  }

  function isDecorOccupied(c, r) {
    return furniture.some((f) => {
      const def = FURN_BY_ID[f.id];
      return def && def.category === "decor" && footprintCells(def, f.col, f.row).includes(c + "," + r);
    });
  }

  // computes the next single-cell step toward a target delta (dc, dr), preferring the
  // larger axis but avoiding decor-occupied cells; falls back to ignoring decor (but still
  // avoiding solid/occupied cells) if both preferred directions are decor-blocked, so the
  // character never gets permanently stuck when decor items line the path; returns null only
  // if truly no adjacent cell is available. targetCol/targetRow (optional) mark the final
  // destination cell as always steppable even if it's decor-occupied, since decor items
  // (pillow, washer, etc.) ARE the destination for their interaction gag.
  function computeStepAvoidingDecor(col, row, dc, dr, targetCol, targetRow) {
    const preferCol = Math.abs(dc) >= Math.abs(dr) && dc !== 0;
    const tryCol = () => dc !== 0 ? { nc: col + (dc > 0 ? 1 : -1), nr: row, pose: dc > 0 ? "right" : "left" } : null;
    const tryRow = () => dr !== 0 ? { nc: col, nr: row + (dr > 0 ? 1 : -1), pose: dr > 0 ? "front" : "back" } : null;
    const first = preferCol ? tryCol() : tryRow();
    const second = preferCol ? tryRow() : tryCol();
    const isTarget = (c, r) => targetCol !== undefined && c === targetCol && r === targetRow;
    if (first && (isTarget(first.nc, first.nr) || !isDecorOccupied(first.nc, first.nr))) return first;
    if (second && (isTarget(second.nc, second.nr) || !isDecorOccupied(second.nc, second.nr))) return second;
    // どちらも装飾品でふさがっている場合は、完全に固まってしまわないよう装飾品は無視して進む
    if (first && !isCellOccupied(first.nc, first.nr)) return first;
    if (second && !isCellOccupied(second.nc, second.nr)) return second;
    return null;
  }

  function findFreeCell(preferCol, preferRow) {
    if (!isCellOccupied(preferCol, preferRow)) return { col: preferCol, row: preferRow };
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        if (!isCellOccupied(c, r)) return { col: c, row: r };
      }
    }
    return { col: preferCol, row: preferRow };
  }

  function placeFurniture(itemId, placeCol, placeRow) {
    const def = FURN_BY_ID[itemId];
    const newCells = footprintCells(def, placeCol, placeRow);
    furniture = furniture.filter((f) => {
      const otherDef = FURN_BY_ID[f.id];
      const otherCells = footprintCells(otherDef, f.col, f.row);
      return !otherCells.some((cell) => newCells.includes(cell));
    });
    furniture.push({ id: itemId, col: placeCol, row: placeRow });
    furnSave();
    renderFurniture();
    buildFurnTray();
  }

  function renderFurniture() {
    furnLayer.innerHTML = "";
    let neededFixSave = false;
    furniture.forEach((f) => {
      const def = FURN_BY_ID[f.id];
      if (!def) return;
      const maxCol = GRID_SIZE - def.wCells;
      const maxRow = GRID_SIZE - def.hCells;
      if (f.col > maxCol || f.row > maxRow) {
        f.col = Math.max(0, Math.min(f.col, maxCol));
        f.row = Math.max(0, Math.min(f.row, maxRow));
        neededFixSave = true;
      }
      const fp = projectFootprint(f.col, f.row, def.wCells, def.hCells);
      const el = document.createElement("div");
      el.className = "furn-item";
      el.dataset.itemId = f.id;
      el.style.left = fp.centerXPct + "%";
      el.style.top = fp.bottomYPct + "%";
      el.style.width = (fp.widthPct * (def.displayScale || 1)) + "%";
      const isFloorBedding = def.category === "bedding";
      el.style.zIndex = 100 + (isFloorBedding ? f.row : (f.row + def.hCells - 1)) * 10;
      const img = document.createElement("img");
      const toggleOnImg = TOGGLABLE_FURNITURE[f.id];
      if (f.id === "coffin") {
        img.src = f.sleeping ? COFFIN_OPEN_IMG : def.img;
      } else if (f.playing && def.playImg) {
        img.src = def.playImg;
      } else {
        img.src = (toggleOnImg && f.on) ? toggleOnImg : def.img;
      }
      if (f.flipped) img.style.transform = "scaleX(-1)";
      img.draggable = false;
      el.appendChild(img);
      el.addEventListener("contextmenu", (e) => e.preventDefault());
      el.addEventListener("pointerdown", (e) => {
        if (editMode) startPlacedItemPress(e, f, el);
      });
      el.addEventListener("click", () => {
        if (editMode) {
          f.flipped = !f.flipped;
          img.style.transform = f.flipped ? "scaleX(-1)" : "";
          furnSave();
          return;
        }
        if (toggleOnImg) {
          f.on = !f.on;
          img.src = f.on ? toggleOnImg : def.img;
          furnSave();
        } else if (f.id === "record_player" || f.id === "record_player_toya") {
          toggleRecordPlayer();
        }
      });
      furnLayer.appendChild(el);
    });
    if (neededFixSave) furnSave();
  }

  const LONG_PRESS_MS = 260;
  const MOVE_CANCEL_PX = 10;

  function startPressTimer(e, itemId, chipEl) {
    if (!editMode) return;
    pressStartX = e.clientX;
    pressStartY = e.clientY;
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => {
      chipEl.classList.add("pressed");
      chipEl.style.touchAction = "none";
      beginDrag(itemId, e.clientX, e.clientY);
    }, LONG_PRESS_MS);

    const cancelIfMoved = (ev) => {
      if (isDragging) return;
      const dx = ev.clientX - pressStartX, dy = ev.clientY - pressStartY;
      if (Math.hypot(dx, dy) > MOVE_CANCEL_PX) {
        clearTimeout(longPressTimer);
        document.removeEventListener("pointermove", cancelIfMoved);
      }
    };
    document.addEventListener("pointermove", cancelIfMoved);
    document.addEventListener("pointerup", () => {
      clearTimeout(longPressTimer);
      chipEl.classList.remove("pressed");
      chipEl.style.touchAction = "pan-x";
      document.removeEventListener("pointermove", cancelIfMoved);
    }, { once: true });
  }

  function beginDrag(itemId, clientX, clientY) {
    isDragging = true;
    dragItemId = itemId;
    dragSourceFurniture = null;
    const def = FURN_BY_ID[itemId];
    dragGhostImg.src = def.img;
    dragGhost.classList.add("show");
    dragHighlight.classList.add("show");
    updateDrag(clientX, clientY);
  }

  function startPlacedItemPress(e, furnObj, el) {
    if (!editMode) return;
    pressStartX = e.clientX;
    pressStartY = e.clientY;
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => {
      el.classList.add("pressed");
      beginDragPlaced(furnObj, e.clientX, e.clientY);
    }, LONG_PRESS_MS);

    const cancelIfMoved = (ev) => {
      if (isDragging) return;
      const dx = ev.clientX - pressStartX, dy = ev.clientY - pressStartY;
      if (Math.hypot(dx, dy) > MOVE_CANCEL_PX) {
        clearTimeout(longPressTimer);
        document.removeEventListener("pointermove", cancelIfMoved);
      }
    };
    document.addEventListener("pointermove", cancelIfMoved);
    document.addEventListener("pointerup", () => {
      clearTimeout(longPressTimer);
      el.classList.remove("pressed");
      document.removeEventListener("pointermove", cancelIfMoved);
    }, { once: true });
  }

  function beginDragPlaced(furnObj, clientX, clientY) {
    isDragging = true;
    dragItemId = furnObj.id;
    dragSourceFurniture = furnObj;
    const def = FURN_BY_ID[furnObj.id];
    dragGhostImg.src = def.img;
    dragGhost.classList.add("show");
    dragHighlight.classList.add("show");
    updateDrag(clientX, clientY);
  }

  function updateDrag(clientX, clientY) {
    dragGhost.style.left = clientX + "px";
    dragGhost.style.top = clientY + "px";

    const trayRect = furnTray.getBoundingClientRect();
    dragOverTray = clientX >= trayRect.left && clientX <= trayRect.right &&
      clientY >= trayRect.top && clientY <= trayRect.bottom;
    if (dragOverTray) {
      furnTray.classList.add("drag-over");
      dragHighlight.classList.remove("show");
      dragOverRoom = false;
      return;
    }
    furnTray.classList.remove("drag-over");

    const rect = room.getBoundingClientRect();
    const px = (clientX - rect.left) / rect.width;
    const py = (clientY - rect.top) / rect.height;
    dragOverRoom = px >= 0 && px <= 1 && py >= 0 && py <= 1;

    if (!dragOverRoom) {
      dragHighlight.classList.remove("show");
      return;
    }
    dragHighlight.classList.add("show");

    const def = FURN_BY_ID[dragItemId];
    const near = nearestCell(px, py);
    const placeCol = Math.min(near.col, GRID_SIZE - def.wCells);
    const placeRow = Math.min(near.row, GRID_SIZE - def.hCells);
    dragAnchor = { col: placeCol, row: placeRow };

    const fp = projectFootprint(placeCol, placeRow, def.wCells, def.hCells);
    dragHighlight.style.left = (fp.centerXPct - fp.widthPct / 2) + "%";
    dragHighlight.style.top = fp.topYPct + "%";
    dragHighlight.style.width = fp.widthPct + "%";
    dragHighlight.style.height = (fp.bottomYPct - fp.topYPct) + "%";
  }

  function endDrag() {
    if (isDragging && dragSourceFurniture) {
      if (dragOverTray) {
        furniture = furniture.filter((x) => x !== dragSourceFurniture);
        furnSave();
        renderFurniture();
        buildFurnTray();
      } else if (dragOverRoom && dragAnchor) {
        dragSourceFurniture.col = dragAnchor.col;
        dragSourceFurniture.row = dragAnchor.row;
        furnSave();
        renderFurniture();
      }
    } else if (isDragging && dragOverRoom && dragAnchor) {
      placeFurniture(dragItemId, dragAnchor.col, dragAnchor.row);
    }
    isDragging = false;
    dragItemId = null;
    dragAnchor = null;
    dragSourceFurniture = null;
    dragOverTray = false;
    dragGhost.classList.remove("show");
    dragHighlight.classList.remove("show");
    furnTray.classList.remove("drag-over");
    furnTray.querySelectorAll(".furn-chip").forEach((c) => c.classList.remove("pressed"));
  }

  document.addEventListener("pointermove", (e) => {
    if (!isDragging) return;
    updateDrag(e.clientX, e.clientY);
  });
  document.addEventListener("pointerup", () => { if (isDragging) endDrag(); });

  function foodEffectDescription(food) {
    const labels = { energy: "げんき", hunger: "おなか", happy: "きげん" };
    const maxes = { energy: ENERGY_MAX, hunger: HUNGER_MAX, happy: HAPPY_MAX };
    const label = labels[food.effect];
    const max = maxes[food.effect];
    if (!label || !max) return food.name;
    const pct = Math.max(10, Math.round((food.amount / max * 100) / 10) * 10);
    return label + "ゲージ" + pct + "%回復";
  }

    state.money -= totalCost;
    state.ownedItems = state.ownedItems || {};

    save();
    updateBars();
    buildFurnTray();

  let companionCol = 2, companionRow = 3;

  let companionPauseUntil = 0;

  function companionStep() {
    const pet = state.selectedPetId && PET_BY_ID[state.selectedPetId];
    if (!pet || !((state.ownedPets || {})[pet.id] > 0)) return;
    if (Date.now() < companionPauseUntil) return;
    if (editMode || inDialogue) return;
    if (!companionTarget) {
      let candidate = null;
      for (let tries = 0; tries < 8; tries++) {
        const newCol = Math.max(0, Math.min(GRID_SIZE - 1, companionCol + Math.floor(Math.random() * 5) - 2));
        const newRow = Math.max(0, Math.min(GRID_SIZE - 1, companionRow + Math.floor(Math.random() * 5) - 2));
        if (!isDecorOccupied(newCol, newRow)) { candidate = { col: newCol, row: newRow }; break; }
      }
      companionTarget = candidate || { col: companionCol, row: companionRow };
    }
    const dc = companionTarget.col - companionCol;
    const dr = companionTarget.row - companionRow;
    if (dc === 0 && dr === 0) {
      companionTarget = null;
      companionPauseUntil = Date.now() + 1200 + Math.random() * 2000;
      return;
    }
    const cstep = computeStepAvoidingDecor(companionCol, companionRow, dc, dr);
    if (!cstep) { companionTarget = null; return; }
    companionCol = cstep.nc;
    companionRow = cstep.nr;
    const poseIdx = cstep.pose === "right" ? 3 : cstep.pose === "left" ? 2 : cstep.pose === "front" ? 0 : 1;
    companionFacing = poseIdx;
    const p = projectGrid(companionCol, companionRow);
    companionAnchor.style.left = p.xPct + "%";
    companionAnchor.style.top = p.yPct + "%";
    companionAnchor.style.zIndex = 100 + companionRow * 10 + 4;
    companionSprite.src = pet.poses[poseIdx];
  }

  function refreshCompanion() {

    }
    companionTarget = null;
    companionPauseUntil = 0;
    const p0 = projectGrid(companionCol, companionRow);
    companionAnchor.style.left = p0.xPct + "%";
    companionAnchor.style.top = p0.yPct + "%";
    companionSprite.src = pet.poses[0];
    companionFacing = 0;

  }

  function grantItem(grantType, grantId) {
    if (grantType === "furniture") {
      state.ownedItems = state.ownedItems || {};
      state.ownedItems[grantId] = (state.ownedItems[grantId] || 0) + 1;
      buildFurnTray();
    } else if (grantType === "food") {
      state.ownedFood = state.ownedFood || {};
      state.ownedFood[grantId] = (state.ownedFood[grantId] || 0) + 1;
    } else if (grantType === "other") {
      state.ownedOther = state.ownedOther || {};
      state.ownedOther[grantId] = (state.ownedOther[grantId] || 0) + 1;
    } else if (grantType === "seed") {
      state.ownedSeeds = state.ownedSeeds || {};
      state.ownedSeeds[grantId] = (state.ownedSeeds[grantId] || 0) + 1;
    } else if (grantType === "wallpaper") {
      state.ownedWallpapers = state.ownedWallpapers || [];
      if (!state.ownedWallpapers.includes(grantId)) state.ownedWallpapers.push(grantId);
    }
  }

  function ownedCostCount(costType, id) {
    if (costType === "food") return ownedFoodCount(id);
    return ownedOtherCount(id);
  }

  function deductCost(costType, id, amount) {
    if (costType === "food") {
      state.ownedFood[id] -= amount;
    } else {
      state.ownedOther[id] -= amount;

  }

  function doExchange(id, qty) {
    qty = qty || 1;
    const ex = EXCHANGE_CATALOG.find((e) => e.id === id);
    if (!ex) return;
    const totalCost = ex.costAmount * qty;
    if (ownedCostCount(ex.costType, ex.costItemId) < totalCost) {
      showToast("こうかんに必要なアイテムがたりない…");
      return;
    }
    deductCost(ex.costType, ex.costItemId, totalCost);
    for (let i = 0; i < qty; i++) grantItem(ex.grantType, ex.grantId);
    save();
    updateBars();
    buildExchangeList();
    showToast(ex.name + "を" + qty + "こ こうかんした！");
  }

  // advance a plot's accumulated (watered-only) growth time up to `now`
  function advancePlotGrowth(plot, now) {
    if (!plot) return;
    const elapsed = now - plot.lastUpdateTs;
    if (elapsed <= 0) return;
    const wateredEnd = Math.min(now, plot.wateredUntil || 0);
    const wateredElapsed = Math.max(0, wateredEnd - plot.lastUpdateTs);
    plot.growProgressMs = Math.min(GROW_TOTAL_MS, (plot.growProgressMs || 0) + wateredElapsed);
    plot.lastUpdateTs = now;
  }

  function plotStage(plot) {
    if (!plot) return 0; // empty, plantable
    if (plot.growProgressMs >= GROW_TOTAL_MS) return 3; // ready to harvest
    if (plot.growProgressMs >= GROW_TOTAL_MS / 2) return 2;
    return 1;
  }

  function plantSeed(index) {
    const plot = state.farmPlots[index];
    if (plot) return;
    if (ownedSeedCount("basic_seed") <= 0) {
      showToast("たねがないよ、SHOPで買ってね");
      return;
    }
    state.ownedSeeds.basic_seed -= 1;
    state.farmPlots[index] = { seedId: "basic_seed", growProgressMs: 0, lastUpdateTs: Date.now(), wateredUntil: 0 };
    save();
    renderFarmPlots();
    showToast("たねをうえた！");
  }

  function waterPlot(index) {
    const plot = state.farmPlots[index];
    if (!plot) return;
    const now = Date.now();
    advancePlotGrowth(plot, now);
    if (plot.growProgressMs >= GROW_TOTAL_MS) return; // already fully grown, no need to water
    plot.wateredUntil = now + WATER_WINDOW_MS;
    save();
    renderFarmPlots();
    showToast("みずをあげた！");
  }

  function harvestPlot(index) {
    const plot = state.farmPlots[index];
    if (!plot) return;
    advancePlotGrowth(plot, Date.now());
    if (plot.growProgressMs < GROW_TOTAL_MS) return;
    state.farmPlots[index] = null;
    state.ownedFood = state.ownedFood || {};
    state.ownedFood.egg = (state.ownedFood.egg || 0) + 4;
    save();
    updateBars();
    renderFarmPlots();
    showToast("しゅうかくした！たまご×4");
  }

  function formatRemaining(ms) {
    const totalMin = Math.max(0, Math.ceil(ms / 60000));
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return h > 0 ? h + "時間" + m + "分" : m + "分";
  }

  const FARM_PLOT_STAGE_WIDTH = { 1: 6, 2: 9, 3: 11 };

  function unlockColumn(columnId) {
    const col = FARM_COLUMNS.find((c) => c.id === columnId);
    if (!col || isColumnUnlocked(columnId)) return;
    if (state.money < col.price) {
      showToast("お金がたりない…");
      return;
    }
    state.money -= col.price;
    state.farmUnlockedColumns = state.farmUnlockedColumns || {};
    state.farmUnlockedColumns[columnId] = true;
    save();
    updateBars();
    renderFarmPlots();
    showToast("この列をかいほうした！");
  }

  function renderFarmPlots() {
    farmPlotLayer.innerHTML = "";
    const now = Date.now();
    state.farmPlots.forEach((plot, index) => {
      advancePlotGrowth(plot, now);
      const pos = FARM_PLOT_POSITIONS[index];
      const el = document.createElement("div");
      el.className = "farm-plot";
      el.style.left = pos.xPct + "%";
      el.style.top = pos.yPct + "%";

      const column = farmColumnForIndex(index);
      if (column && !isColumnUnlocked(column.id)) {
        el.style.width = "9%";
        el.innerHTML = '<div class="plot-lock">🔒<span>' + COIN_ICON + column.price + "</span></div>";
        el.title = "タップしてこの列をかいほうする";
        el.addEventListener("click", () => unlockColumn(column.id));
        farmPlotLayer.appendChild(el);
        return;
      }

      const stage = plotStage(plot);
      if (stage === 0) {
        el.style.width = "8%";
        el.innerHTML = '<div class="empty-marker"></div>';
        el.title = "タップしてたねをうえる";
        el.addEventListener("click", () => plantSeed(index));
      } else {
        el.style.width = FARM_PLOT_STAGE_WIDTH[stage] + "%";
        const img = stage === 1 ? PLANT_STAGE1_IMG : stage === 2 ? PLANT_STAGE2_IMG : PLANT_STAGE3_IMG;
        el.innerHTML = '<img src="' + img + '" alt="plant">';
        if (stage === 3) {
          el.title = "タップしてしゅうかく";
          el.addEventListener("click", () => harvestPlot(index));
        } else {
          const isWatered = plot.wateredUntil > now;
          const timer = document.createElement("div");
          timer.className = "farm-plot-timer";
          timer.textContent = isWatered
            ? "💧 のこり" + formatRemaining(plot.wateredUntil - now)
            : "💧 みずやり待ち";
          el.appendChild(timer);
          el.title = "タップしてみずをあげる";
          el.addEventListener("click", () => waterPlot(index));
        }
      }
      farmPlotLayer.appendChild(el);
    });
  }

      if (mode !== "acting") { petAnchor.classList.remove("habubu-zoom"); return; } // interrupted by something else
      if (i >= HABUBU_SEQUENCE.length) {
        mode = "idle";
        petAnchor.classList.add("no-transition");
        setSpriteImg("front");

        moveUntilPause = Date.now() + 500;

      setSpriteImg(HABUBU_SEQUENCE[i]);
      i++;
      habubuTimer = setTimeout(playNext, 1000);

  function pullGacha() {
    if (gachaPullBtn.disabled) return;
    const gachaCoinCount = (state.ownedOther && state.ownedOther.gacha_coin) || 0;
    if (gachaCoinCount < 1) {
      showToast("ガシャコインがたりない…");
      return;
    }
    state.ownedOther = state.ownedOther || {};
    state.ownedOther.gacha_coin -= 1;
    save();
    gachaPullBtn.disabled = true;
    gachaResultBox.classList.add("hidden");

    gachaBgImg.classList.add("gacha-shake");
    setTimeout(() => gachaBgImg.classList.remove("gacha-shake"), 400);

    gachaCapsule.classList.remove("hidden", "opened", "dropping");
    void gachaCapsule.offsetWidth; // reset animation
    gachaCapsule.classList.add("dropping");

    setTimeout(() => {
      // three tiers: 大当たり(5%, Chancho, one-time) / 当たり(20%) / 通常(75%)
      save();
      updateBars();
      let resultHtml, resultLabel;
      const alreadyHasChancho = (state.ownedPets && state.ownedPets.chancho > 0);
      const roll = Math.random();
      if (!alreadyHasChancho && roll < 0.05) {
        state.ownedPets = state.ownedPets || {};
        state.ownedPets.chancho = (state.ownedPets.chancho || 0) + 1;
        save();
        resultHtml = '<img src="' + CHANCHO_FRONT_IMG + '" style="width:32px;height:32px;object-fit:contain;">';
        resultLabel = "大当たり！チャンチョ が出た！";
      } else if (roll < 0.25) {
        // 当たり枠 (20%): ルームライトナッツ / テトラポット / ハンガーラック / ピーナッツくんと仲間達(壁紙), picked at random
        const ATARI_POOL = [
          { type: "furniture", id: "roomlight" },
          { type: "furniture", id: "tetrapod" },
          { type: "furniture", id: "hangerrack" },
          { type: "furniture", id: "frappe_trash" },
          { type: "wallpaper", id: "wallpaper_peanutfriends" },
        ];
        const atari = ATARI_POOL[Math.floor(Math.random() * ATARI_POOL.length)];
        let atariDef;
        if (atari.type === "furniture") {
          atariDef = FURNITURE_CATALOG.find((f) => f.id === atari.id);
          state.ownedItems = state.ownedItems || {};
          state.ownedItems[atari.id] = (state.ownedItems[atari.id] || 0) + 1;
          save();
          buildFurnTray();
        } else {
          atariDef = WALLPAPER_CATALOG.find((w) => w.id === atari.id);
          grantItem("wallpaper", atari.id);
          save();
        }
        resultHtml = '<img src="' + atariDef.img + '" style="width:32px;height:32px;object-fit:contain;">';
        resultLabel = atariDef.name + " が出た！";
      } else {
        // 通常枠 (75%): 5種のぬいぐるみから均等に抽選
        const NORMAL_IDS = ["plushie_tagame", "plushie_ikakin", "plushie_ikirioteku", "plushie_layer", "plushie_orangehakase"];
        const normalId = NORMAL_IDS[Math.floor(Math.random() * NORMAL_IDS.length)];

        resultHtml = '<img src="' + normalDef.img + '" style="width:32px;height:32px;object-fit:contain;">';
        resultLabel = normalDef.name + " が出た！";

      gachaResultBox.innerHTML = resultLabel;
      setTimeout(() => {
        gachaResultBox.classList.remove("hidden");
        gachaPullBtn.disabled = false;
      }, 500);
    }, 900);
  }

  function applyStatTick() {
    const happyLowHungerMult = state.hunger < HUNGER_MAX * 0.15 ? 2 : 1;
    if (mode === "sleeping") {
      state.energy = clamp(state.energy + SLEEP_ENERGY_PER_TICK, ENERGY_MAX);
      state.hunger = clamp(state.hunger - HUNGER_DECAY_PER_TICK, HUNGER_MAX);
      state.happy = clamp(state.happy - HAPPY_DECAY_PER_TICK * happyLowHungerMult);
    } else if (mode === "working") {
      const wasEnergized = state.energy > 0;
      if (wasEnergized) {
        state.workAccumMs = (state.workAccumMs || 0) + STAT_TICK_MS;
        while (state.workAccumMs >= WORK_PAYOUT_MS && state.energy > 0) {
          state.workAccumMs -= WORK_PAYOUT_MS;
          const stats = workStatsForLevel(state.level);
          gainMoney(stats.money);
          gainExp(stats.xp);
          state.sessionMoney = (state.sessionMoney || 0) + stats.money;
          state.sessionXp = (state.sessionXp || 0) + stats.xp;
          showWorkFloat("+" + stats.money + COIN_ICON + " +" + stats.xp + "⭐");
        }
        const energyStats = workStatsForLevel(state.level);
        state.energy = clamp(state.energy - energyStats.energy / TICKS_PER_PAYOUT, ENERGY_MAX);
      }
      state.hunger = clamp(state.hunger - HUNGER_DECAY_PER_TICK * WORK_PLAY_HUNGER_MULTIPLIER, HUNGER_MAX);
      state.happy = clamp(state.happy - HAPPY_DECAY_PER_TICK * happyLowHungerMult);
      if (wasEnergized && state.energy <= 0) {
        exitWork();
        return;
      } else if (Math.random() < 0.3) {
        showWorkEmote(state.energy < ENERGY_MAX * 0.25 ? "😩" : "💦");
      }
    } else if (mode === "playing") {
      state.happy = clamp(state.happy + PLAY_HAPPY_PER_TICK);
      state.energy = clamp(state.energy - PLAY_ENERGY_PER_TICK, ENERGY_MAX);
      state.hunger = clamp(state.hunger - HUNGER_DECAY_PER_TICK * WORK_PLAY_HUNGER_MULTIPLIER, HUNGER_MAX);
      state.playAccumMs = (state.playAccumMs || 0) + STAT_TICK_MS;
      while (state.playAccumMs >= PLAY_PAYOUT_MS) {
        state.playAccumMs -= PLAY_PAYOUT_MS;
        const toy = furniture.find((f) => f.id === state.playingToyId);
        const toyDef = toy && FURN_BY_ID[toy.id];
        const xp = (toyDef && toyDef.playXpPer10Min) || DEFAULT_PLAY_XP;
        gainExp(xp);
      }
      if (state.energy <= 0) {
        const toy = furniture.find((f) => f.id === state.playingToyId);
        exitPlay(toy);
        return;
      }
    } else {
      state.hunger = clamp(state.hunger - HUNGER_DECAY_PER_TICK, HUNGER_MAX);
      state.happy = clamp(state.happy - HAPPY_DECAY_PER_TICK * happyLowHungerMult);
      const poopMultiplier = 1 + poops.length; // 0 poop=1x, 1=2x, 2=3x, 3=4x...
      state.energy = clamp(state.energy - AWAKE_ENERGY_DECAY_PER_TICK * poopMultiplier, ENERGY_MAX);
    }
    if (state.hunger <= 0) {
      if (!state.hungerZeroSince) {
        state.hungerZeroSince = Date.now();
        state.hungerPenaltiesApplied = 0;
      }
      checkHungerPenalty();
    } else {
      state.hungerZeroSince = null;
      state.hungerPenaltiesApplied = 0;
    }
    if (mode === "sleeping" && state.energy >= ENERGY_MAX) wakeUp();
    maybeSpawnPoop();
    updateBars();
    save();
  }

  function updateBars() {
    petName.textContent = state.name;
    petMeta.textContent = "Lv." + state.level;
    petMoney.innerHTML = COIN_ICON + Math.floor(state.money);
    document.getElementById("bar-hunger").style.width = (state.hunger / HUNGER_MAX * 100) + "%";
    document.getElementById("bar-happy").style.width = state.happy + "%";
    document.getElementById("bar-energy").style.width = (state.energy / ENERGY_MAX * 100) + "%";
    const li = levelInfo(state.exp);
    document.getElementById("bar-exp").style.width = (li.into / li.need * 100) + "%";
    sleepBtn.innerHTML = mode === "sleeping"
      ? '<span class="ic">☀️</span>おきる'
      : '<span class="ic">🌙</span>ねる';
  }

  function loseLevel() {
    if (state.level <= 1) return;
    const targetLevel = state.level - 1;
    let cum = 0;
    for (let l = 1; l < targetLevel; l++) cum += xpNeededForLevel(l);
    state.exp = cum;
    state.level = targetLevel;
  }

  const HUNGER_STARVE_PENALTY_MS = 48 * 60 * 60 * 1000;

  function checkHungerPenalty() {
    if (state.hunger > 0 || !state.hungerZeroSince) return;
    const zeroDuration = Date.now() - state.hungerZeroSince;
    if (zeroDuration >= HUNGER_STARVE_PENALTY_MS && !(state.hungerPenaltiesApplied > 0)) {
      loseLevel();
      state.hungerPenaltiesApplied = 1;
      showToast("お腹がすきすぎてレベルがさがった…");
    }
  }

  function gainExp(amount) {
    state.exp += amount;
    const newLevel = levelFromExp(state.exp);
    if (newLevel > state.level) {
      const levelsGained = newLevel - state.level;
      state.ownedPresents = (state.ownedPresents || 0) + levelsGained;
      showToast("レベルアップ！ Lv." + newLevel + "（プレゼント×" + levelsGained + "）");
    }
    state.level = newLevel;
  }

  function gainMoney(amount) {
    state.money = Math.min(999999, state.money + amount);
  }

  function maybeSpawnPoop() {
    if (mode === "working") return; // pet isn't home, so no mess accumulates there
    if (editMode) return; // don't mess up the room while placing furniture
    if (furniture.some((f) => f.id === "toilet")) return; // toilet in the house — no more accidents
    if (poops.length < 3 && Math.random() < 0.02) {
      const c = col, r = row;
      if (!isCellOccupied(c, r) && !poops.some((p) => p.col === c && p.row === r)) {
        poops.push({ col: c, row: r, id: poopSeq++ });
        poopSave();
        renderPoops();
      }
    }
  }

  function renderPoops() {

      el.className = "poop";
      el.style.left = proj.xPct + "%";
      el.style.top = proj.yPct + "%";
      el.style.fontSize = (14 + proj.scale * 12) + "px";
      el.style.zIndex = 100 + p.row * 10 + 3;

        showToast("おそうじ！");
        updateBars();
        renderPoops();
        poopSave();
        save();
      });
      room.appendChild(el);
    });
  }

    petAnchor.classList.remove("hidden");
    petAnchor.classList.add("no-transition");
    petAnchor.classList.remove("lying");
    sprite.style.transform = "";
    setSpriteImg("front");
    renderPosition();
    void petAnchor.offsetWidth; // force reflow so the snap applies before re-enabling transitions
    requestAnimationFrame(() => { petAnchor.classList.remove("no-transition"); });
    zzzFloat.classList.remove("show");
    showToast("すっきり めがさめた！");
    showEmote("😊");
    moveUntilPause = Date.now() + 800;
  }

  function sleepToggle() {
    foodTray.classList.add("hidden");
    if (mode === "working") return showToast("しごと中みたい…");
    if (mode === "sleeping" || mode === "walking-to-sleep") { wakeUp(); return; }
    if (mode === "acting" || mode === "playing" || mode === "walking-to-play") return showToast("ちょっとまってね…");
    cancelTransientAnim();
    const bed = findSleepFurniture();
    if (bed) {
      const def = FURN_BY_ID[bed.id];
      const tCol = bed.col;
      const tRow = bed.row + def.hCells - 1;
      if (tCol !== col || tRow !== row) {
        mode = "walking-to-sleep";
        sleepTarget = { col: tCol, row: tRow };
        showToast("おふとんへ…");
        return;
      }
    }
    enterSleep();
  }

  function cancelTransientAnim() {
    clearTimeout(settleTimer);
    clearTimeout(danceTimer);
    if (mode === "hugging") {
      petAnchor.classList.remove("hidden");
      const pillowEl = furnLayer.querySelector('.furn-item[data-item-id="pillow"]');
      if (pillowEl) {
        pillowEl.querySelector("img").src = PILLOW_IMG;
        pillowEl.style.width = (parseFloat(pillowEl.style.width) / PILLOW_HUG_WIDTH_RATIO) + "%";
      }
      setSpriteImg("front");
    } else if (mode === "in-washer") {
      petAnchor.classList.remove("hidden");
      const washerEl = furnLayer.querySelector('.furn-item[data-item-id="washer"]');
      if (washerEl) washerEl.querySelector("img").src = WASHER_IMG;
      setSpriteImg("front");
    } else if (mode === "sitting") {
      sprite.classList.remove("nudge-left");
      setSpriteImg("front");
    } else if (mode === "dancing") {
      setSpriteImg("front");
    }
    if (mode === "hugging" || mode === "in-washer" || mode === "sitting" || mode === "dancing" || mode === "walking-to-pillow" || mode === "walking-to-washer" || mode === "walking-to-toilet") {
      mode = "idle";
    }
  }

  function playToggle() {
    foodTray.classList.add("hidden");
    if (mode === "sleeping" || mode === "walking-to-sleep") return showToast("ねているみたい…");
    if (mode === "working") return showToast("しごと中みたい…");
    if (mode === "playing") { const toy = furniture.find((f) => f.id === state.playingToyId); exitPlay(toy); return; }
    if (mode === "walking-to-play") { mode = "idle"; playTarget = null; return; }
    if (mode === "acting") return showToast("ちょっとまってね…");
    cancelTransientAnim();
    if (state.hunger <= 0) return showToast("おなかがすいてて遊べない…");
    if (state.energy <= 0) return showToast("げんきがなくて遊べない…");
    const toy = findPlayFurniture();
    if (!toy) return showToast("遊具がないよ、SHOPで買ってね");
    const def = FURN_BY_ID[toy.id];
    const tCol = toy.col;
    const tRow = toy.row + def.hCells - 1;
    if (tCol !== col || tRow !== row) {
      mode = "walking-to-play";
      playTarget = { col: tCol, row: tRow, furnId: toy.id };
      showToast("あそびに行く…");
      return;
    }
    enterPlay(toy);
  }

  let playAnimTimer = null;
  function startPlayAnim(toy) {
    clearInterval(playAnimTimer);
    toy.playFrame = 0;
    playAnimTimer = setInterval(() => {
      const t = furniture.find((f) => f.id === state.playingToyId);
      if (!t || !t.playing) { clearInterval(playAnimTimer); return; }
      const def = FURN_BY_ID[t.id];
      if (!def || !def.playImg2) return;
      t.playFrame = t.playFrame ? 0 : 1;
      const img = furnLayer.querySelector('.furn-item[data-item-id="' + t.id + '"] img');
      if (img) img.src = t.playFrame ? def.playImg2 : def.playImg;
    }, 400);
  }

  function enterPlay(toy) {
    mode = "playing";
    state.playing = true;
    state.playingToyId = toy.id;
    state.playAccumMs = 0;
    petAnchor.classList.add("hidden");
    toy.playing = true;
    furnSave();
    renderFurniture();
    showToast("あそんでいる…");
    save();
    startPlayAnim(toy);
  }

  function exitPlay(toy) {
    clearInterval(playAnimTimer);
    if (toy && furniture.includes(toy)) {
      toy.playing = false;
      toy.playFrame = 0;
      furnSave();
      renderFurniture();
    }
    mode = "idle";
    state.playing = false;
    state.playingToyId = null;
    state.playAccumMs = 0;
    petAnchor.classList.remove("hidden");
    showToast("たのしかった！");
    showEmote("⚽");
    updateBars();
    save();
    moveUntilPause = Date.now() + 700;
  }

  const DANCE_SEQUENCE = ["danceLeft", "front", "danceRight", "front", "danceLeft", "front", "danceRight", "front"];
  let danceTimer = null;

  function startDancing() {
    mode = "dancing";
    let i = 0;
    const playNext = () => {
      if (mode !== "dancing") return; // interrupted by something else
      if (i >= DANCE_SEQUENCE.length) {
        mode = "idle";
        setSpriteImg("front");
        moveUntilPause = Date.now() + 500 + Math.random() * 1000;
        return;
      }
      setSpriteImg(DANCE_SEQUENCE[i]);
      i++;
      danceTimer = setTimeout(playNext, 1000);
    };
    playNext();
  }

  function enterSleep() {
    mode = "sleeping";
    state.sleeping = true;

    const bed = findSleepFurniture();
    if (bed && bed.id === "coffin") {
      petAnchor.classList.add("hidden");
      bed.sleeping = true;
      furnSave();
      renderFurniture();
      const coffinDef = FURN_BY_ID[bed.id];
      const coffinFp = projectFootprint(bed.col, bed.row, coffinDef.wCells, coffinDef.hCells);
      coffinZzz.style.left = (coffinFp.centerXPct - coffinFp.widthPct * 0.28) + "%";
      coffinZzz.style.top = (coffinFp.topYPct - 7) + "%";
      coffinZzz.classList.remove("hidden");
      coffinZzzInner.classList.add("show");
      setTimeout(() => {
        if (mode === "sleeping" && furniture.includes(bed) && bed.sleeping) {
          bed.sleeping = false;
          furnSave();
          renderFurniture();
        }
      }, 2000);
    } else {
      setSpriteImg("sleep");
      petAnchor.classList.add("lying");
      sprite.style.transform = (bed && bed.flipped) ? "scaleX(-1)" : "";
      if (bed) {
        const def = FURN_BY_ID[bed.id];
        const fp = projectFootprint(bed.col, bed.row, def.wCells, def.hCells);
        const centerYPct = (fp.topYPct + fp.bottomYPct) / 2;
        petAnchor.style.left = fp.centerXPct + "%";
        petAnchor.style.top = centerYPct + "%";
        petAnchor.style.zIndex = 100 + (bed.row + def.hCells - 1) * 10 + 6;
      }
    }

    zzzFloat.classList.add("show");
    showToast("おやすみ…");
    updateBars();
    save();
  }

  function showWorkFloat(text) {
    const el = document.createElement("div");
    el.className = "work-float";
    el.innerHTML = text;
    el.style.top = "40%";
    el.style.left = (45 + Math.random() * 10) + "%";
    workFloatLayer.appendChild(el);
    setTimeout(() => el.remove(), 1700);
  }

  function showScene(name) {
