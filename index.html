    if (name === "factory") {
      room.classList.add("hidden");
      farmStage.classList.add("hidden");
      workStage.classList.remove("hidden");
      homeActions.classList.add("hidden");
      renderWorkPosition();
      updateWorkActionBtn();
    } else if (name === "farm") {
      room.classList.add("hidden");
      workStage.classList.add("hidden");
      farmStage.classList.remove("hidden");
      homeActions.classList.add("hidden");
      renderFarmPlots();
    } else {
      room.classList.remove("hidden");
      workStage.classList.add("hidden");
      farmStage.classList.add("hidden");
      homeActions.classList.remove("hidden");
    }
  }

  function updateWorkActionBtn() {
    if (mode === "working") {
      workActionBtn.textContent = "しごとをやめる";
      workActionBtn.classList.add("stop");
    } else {
      workActionBtn.textContent = "しごとをする";
      workActionBtn.classList.remove("stop");
    }
  }

  function enterWork() {
    if (mode === "sleeping" || mode === "walking-to-sleep") return showToast("ねているみたい…");
    if (mode === "acting" || mode === "playing" || mode === "walking-to-play") return showToast("ちょっとまってね…");
    cancelTransientAnim();
    if (state.hunger <= 0) return showToast("おなかがすいてて働けない…");
    if (state.happy <= 0) return showToast("きげんが悪くて働けない…");
    if (state.energy <= 0) return showToast("げんきがなくて働けない…");
    mode = "working";
    state.working = true;
    state.sessionMoney = 0;
    state.sessionXp = 0;
    petAnchor.classList.add("hidden");
    workPetAnchor.classList.remove("hidden");
    workMoveUntilPause = 0;
    setWorkSpriteImg("front");
    renderWorkPosition();
    playWorkStartSound();
    showToast("しごと開始！");
    updateWorkActionBtn();
    updateBars();
    save();
  }

  function exitWork() {
    mode = "idle";
    state.working = false;
    clearInterval(slackCycleTimer);
    clearTimeout(slackEndTimer);
    clearTimeout(caughtTimer);
    clearTimeout(tripTimer);
    workMoveState = "idle";
    const earnedMoney = Math.floor(state.sessionMoney || 0);
    const earnedXp = state.sessionXp || 0;
    state.sessionMoney = 0;
    state.sessionXp = 0;
    petAnchor.classList.remove("hidden");
    workPetAnchor.classList.add("hidden");
    renderPosition();
    setSpriteImg("front");
    moveUntilPause = Date.now() + 800;
    playWorkEndSound();
    showToast("しごと終了！ " + COIN_ICON + "+" + earnedMoney + " ⭐+" + earnedXp);
    updateWorkActionBtn();
    updateBars();
    save();
  }

  function workActionToggle() {
    if (mode === "working") { exitWork(); return; }
    enterWork();
  }

  feedBtn.addEventListener("click", () => {
    if (mode === "sleeping") return showToast("ねているみたい…");
    if (mode === "walking-to-sleep") return showToast("おふとんに向かってる…");
    if (mode === "working") return showToast("しごと中みたい…");
    recordTray.classList.add("hidden");
    const willShow = foodTray.classList.contains("hidden");
    if (willShow) buildFoodTray();
    foodTray.classList.toggle("hidden", !willShow);
  });
  playBtn.addEventListener("click", playToggle);
  sleepBtn.addEventListener("click", sleepToggle);
  workEnterArrow.addEventListener("click", () => {
    if (editMode) { showToast("かぐの配置中は行けないよ"); return; }
    foodTray.classList.add("hidden");
    showScene("factory");
  });
  workExitArrow.addEventListener("click", () => showScene("home"));
  workActionBtn.addEventListener("click", workActionToggle);

  farmEnterArrow.addEventListener("click", () => {
    if (editMode) { showToast("かぐの配置中は行けないよ"); return; }
    foodTray.classList.add("hidden");
    showScene("farm");
  });
  farmExitArrow.addEventListener("click", () => showScene("home"));

  const resetConfirmModal = document.getElementById("resetConfirmModal");
  const resetCancelBtn = document.getElementById("resetCancelBtn");
  const resetConfirmBtn = document.getElementById("resetConfirmBtn");

  resetBtn.addEventListener("click", () => {
    resetConfirmModal.classList.remove("hidden");
  });

  resetCancelBtn.addEventListener("click", () => {
    resetConfirmModal.classList.add("hidden");
  });

  resetConfirmBtn.addEventListener("click", () => {
    resetConfirmModal.classList.add("hidden");
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    try { localStorage.removeItem(FURNITURE_KEY); } catch (e) {}
    try { localStorage.removeItem(POOP_KEY); } catch (e) {}

    // full in-app reset (no page reload — avoids a race where a delayed/blocked
    // reload wipes the name the user is mid-way through typing)
    state = Object.assign({}, DEFAULT_STATE);
    furniture = [];
    poops = [];
    document.querySelectorAll(".poop").forEach((el) => el.remove());
    renderFurniture();
    clearInterval(companionTimer);
    companionAnchor.classList.add("hidden");
    workPetAnchor.classList.add("hidden");
    petAnchor.classList.remove("hidden");
    mode = "idle";
    closeMenuPanel();
    gameCard.classList.add("hidden");
    introCard.classList.remove("hidden");
    nameInput.value = "";
    nameInput.focus();
  });

  function beginGame(name) {
    state = Object.assign({}, DEFAULT_STATE, { name: name || "きいろちゃん", born: Date.now() });
    state.ownedItems = { futon: 1 };
    state.ownedWallpapers = [];
    state.equippedWallpaper = null;
    state.ownedFloors = [];
    state.equippedFloor = null;
    state.ownedFood = { tenshinhan: 4 };
    state.ownedOther = {};
    state.ownedSeeds = {};
    state.farmPlots = new Array(12).fill(null);
    state.farmUnlockedColumns = {};
    applyWallpaper();
    applyFloor();
    state.bgTheme = "yellow";
    applyBgTheme();
    mode = "idle";
    workCol = 2; workRow = 3;
    furniture = [];
    furnSave();
    poops = [];
    poopSave();
    const start = findFreeCell(2, 3);
    col = start.col; row = start.row;
    introCard.classList.add("hidden");
    gameCard.classList.remove("hidden");
    renderPosition();
    renderWorkPosition();
    setSpriteImg("front");
    updateBars();
    renderPoops();
    buildFurnTray();
    renderFurniture();
    showScene("home");
    save();
    checkLoginBonus();
    refreshCompanion();
  }

  startBtn.addEventListener("click", () => beginGame(nameInput.value.trim()));
  nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") beginGame(nameInput.value.trim()); });

  // ---------------- autonomous grid wandering ----------------
  let workMoveUntilPause = 0;
  let workMoveState = "idle"; // idle | moving | slacking | caught
  let workSettleTimer = null;
  let slackCycleTimer = null;
  let slackEndTimer = null;
  let caughtTimer = null;

  const SLACK_FRAMES = ["slack1", "slack2", "slack3"];
  let slackFrameIndex = 0;

  function startSlacking() {
    workMoveState = "slacking";
    slackFrameIndex = 0;
    setWorkSpriteImg(SLACK_FRAMES[slackFrameIndex]);
    clearInterval(slackCycleTimer);
    slackCycleTimer = setInterval(() => {
      slackFrameIndex = (slackFrameIndex + 1) % SLACK_FRAMES.length;
      setWorkSpriteImg(SLACK_FRAMES[slackFrameIndex]);
    }, 2000);
    clearTimeout(slackEndTimer);
    slackEndTimer = setTimeout(stopSlacking, 8000 + Math.random() * 6000);
  }

  function stopSlacking() {
    clearInterval(slackCycleTimer);
    clearTimeout(slackEndTimer);
    if (workMoveState === "slacking") {
      workMoveState = "idle";
      setWorkSpriteImg("front");
      workMoveUntilPause = Date.now() + 300;
    }
  }

  function catchSlacking() {
    if (workMoveState !== "slacking") return;
    clearInterval(slackCycleTimer);
    clearTimeout(slackEndTimer);
    workMoveState = "caught";
    setWorkSpriteImg("caught");
    clearTimeout(caughtTimer);
    caughtTimer = setTimeout(() => {
      workMoveState = "idle";
      setWorkSpriteImg("front");
      workMoveUntilPause = Date.now() + 300;
    }, 2000);
  }

  workPetScale.addEventListener("click", catchSlacking);

  let tripTimer = null;

  function startTripping() {
    workMoveState = "tripping";
    setWorkSpriteImg("trip1");
    clearTimeout(tripTimer);
    tripTimer = setTimeout(() => {
      setWorkSpriteImg("trip2");
      tripTimer = setTimeout(() => {
        setWorkSpriteImg("trip3");
        tripTimer = setTimeout(() => {
          workMoveState = "idle";
          setWorkSpriteImg("front");
          workMoveUntilPause = Date.now() + 400 + Math.random() * 800;
        }, 1000);
      }, 1000);
    }, 1000);
  }

  function workWanderTick() {
    if (!state || mode !== "working") return;
    if (workMoveState === "moving" || workMoveState === "slacking" || workMoveState === "caught" || workMoveState === "tripping") return;
    const now = Date.now();
    if (now < workMoveUntilPause) return;

    if (Math.random() < 0.05) {
      startSlacking();
      return;
    }
    if (Math.random() < 0.04) {
      startTripping();
      return;
    }

    const options = [];
    if (workRow > 0) options.push({ dc: 0, dr: -1, pose: "back" });
    if (workRow < GRID_SIZE - 1) options.push({ dc: 0, dr: 1, pose: "front" });
    if (workCol > 0) options.push({ dc: -1, dr: 0, pose: "left" });
    if (workCol < GRID_SIZE - 1) options.push({ dc: 1, dr: 0, pose: "right" });
    if (!options.length) return;

    const pick = options[Math.floor(Math.random() * options.length)];
    workCol += pick.dc;
    workRow += pick.dr;
    workMoveState = "moving";
    setWorkSpriteImg(pick.pose);
    renderWorkPosition();

    clearTimeout(workSettleTimer);
    workSettleTimer = setTimeout(() => {
      workMoveState = "idle";
      setWorkSpriteImg("front");
      workMoveUntilPause = Date.now() + 500 + Math.random() * 1200; // busy, brisk pace
    }, 420);
  }

  setInterval(workWanderTick, MOVE_TICK_MS);

  function wanderTick() {
    if (!state) return;
    if (inDialogue || editMode) return;
    if (mode === "sleeping" || mode === "acting" || mode === "working" || mode === "sitting" || mode === "hugging" || mode === "in-washer" || mode === "dancing" || mode === "playing") return;

    if (mode === "walking-to-pillow") {
      if (!pillowTarget) { mode = "idle"; return; }
      const dc = pillowTarget.col - col;
      const dr = pillowTarget.row - row;
      if (dc === 0 && dr === 0) {
        mode = "hugging";
        petAnchor.classList.add("hidden");
        const pillowEl = furnLayer.querySelector('.furn-item[data-item-id="pillow"]');
        if (pillowEl) {
          const img = pillowEl.querySelector("img");
          img.src = PILLOW_HUG_IMG;
          pillowEl.style.width = (parseFloat(pillowEl.style.width) * PILLOW_HUG_WIDTH_RATIO) + "%";
        }
        clearTimeout(settleTimer);
        settleTimer = setTimeout(() => {
          mode = "idle";
          petAnchor.classList.remove("hidden");
          if (pillowEl) {
            pillowEl.querySelector("img").src = PILLOW_IMG;
            pillowEl.style.width = (parseFloat(pillowEl.style.width) / PILLOW_HUG_WIDTH_RATIO) + "%";
          }
          setSpriteImg("front");
          moveUntilPause = Date.now() + 600 + Math.random() * 1200;
        }, 3000 + Math.random() * 2000);
        return;
      }
      const hstep = computeStepAvoidingDecor(col, row, dc, dr, pillowTarget.col, pillowTarget.row);
      if (!hstep) {
        if (++wanderStuckTicks > 10) { wanderStuckTicks = 0; mode = "idle"; pillowTarget = null; moveUntilPause = Date.now() + 500; }
        return;
      }
      wanderStuckTicks = 0;
      col = hstep.nc; row = hstep.nr;
      setSpriteImg(hstep.pose);
      renderPosition();
      return;
    }

    if (mode === "walking-to-washer") {
      if (!washerTarget) { mode = "idle"; return; }
      const dc = washerTarget.col - col;
      const dr = washerTarget.row - row;
      if (dc === 0 && dr === 0) {
        mode = "in-washer";
        petAnchor.classList.add("hidden");
        const washerEl = furnLayer.querySelector('.furn-item[data-item-id="washer"]');
        if (washerEl) washerEl.querySelector("img").src = WASHER_IN_IMG;
        clearTimeout(settleTimer);
        settleTimer = setTimeout(() => {
          mode = "idle";
          petAnchor.classList.remove("hidden");
          if (washerEl) washerEl.querySelector("img").src = WASHER_IMG;
          setSpriteImg("front");
          moveUntilPause = Date.now() + 600 + Math.random() * 1200;
        }, 3000 + Math.random() * 2000);
        return;
      }
      const wstep = computeStepAvoidingDecor(col, row, dc, dr, washerTarget.col, washerTarget.row);
      if (!wstep) {
        if (++wanderStuckTicks > 10) { wanderStuckTicks = 0; mode = "idle"; washerTarget = null; moveUntilPause = Date.now() + 500; }
        return;
      }
      wanderStuckTicks = 0;
      col = wstep.nc; row = wstep.nr;
      setSpriteImg(wstep.pose);
      renderPosition();
      return;
    }

    if (mode === "walking-to-toilet") {
      if (!toiletTarget) { mode = "idle"; return; }
      const dc = toiletTarget.col - col;
      const dr = toiletTarget.row - row;
      if (dc === 0 && dr === 0) {
        wanderStuckTicks = 0;
        mode = "sitting";
        setSpriteImg("sit");
        sprite.classList.add("nudge-left");
        clearTimeout(settleTimer);
        settleTimer = setTimeout(() => {
          mode = "idle";
          setSpriteImg("front");
          sprite.classList.remove("nudge-left");
          moveUntilPause = Date.now() + 600 + Math.random() * 1200;
        }, 3000 + Math.random() * 2000);
        return;
      }
      const step = computeStepAvoidingDecor(col, row, dc, dr, toiletTarget.col, toiletTarget.row);
      if (!step) {
        if (++wanderStuckTicks > 10) { wanderStuckTicks = 0; mode = "idle"; toiletTarget = null; moveUntilPause = Date.now() + 500; }
        return;
      }
      wanderStuckTicks = 0;
      col = step.nc; row = step.nr;
      setSpriteImg(step.pose);
      renderPosition();
      return;
    }

    if (mode === "walking-to-sleep") {
      if (!sleepTarget) { enterSleep(); return; }
      const dc = sleepTarget.col - col;
      const dr = sleepTarget.row - row;
      if (dc === 0 && dr === 0) { enterSleep(); return; }
      const step = computeStepAvoidingDecor(col, row, dc, dr, sleepTarget.col, sleepTarget.row);
      if (!step) return;
      col = step.nc; row = step.nr;
      setSpriteImg(step.pose);
      renderPosition();
      return;
    }

    if (mode === "walking-to-play") {
      const toy = playTarget && furniture.find((f) => f.id === playTarget.furnId);
      if (!playTarget || !toy) { mode = "idle"; playTarget = null; return; }
      const dc = playTarget.col - col;
      const dr = playTarget.row - row;
      if (dc === 0 && dr === 0) { enterPlay(toy); playTarget = null; return; }
      const step = computeStepAvoidingDecor(col, row, dc, dr, playTarget.col, playTarget.row);
      if (!step) return;
      col = step.nc; row = step.nr;
      setSpriteImg(step.pose);
      renderPosition();
      return;
    }

    if (mode === "moving") return;
    const now = Date.now();
    if (now < moveUntilPause) return;

    const toilet = furniture.find((f) => f.id === "toilet");
    if (toilet && !(col === toilet.col && row === toilet.row) && Math.random() < 0.04) {
      mode = "walking-to-toilet";
      toiletTarget = { col: toilet.col, row: toilet.row };
      return;
    }

    const pillow = furniture.find((f) => f.id === "pillow");
    if (pillow && !(col === pillow.col && row === pillow.row) && Math.random() < 0.04) {
      mode = "walking-to-pillow";
      pillowTarget = { col: pillow.col, row: pillow.row };
      return;
    }

    const washer = furniture.find((f) => f.id === "washer");
    if (washer && !(col === washer.col && row === washer.row) && Math.random() < 0.03) {
      mode = "walking-to-washer";
      washerTarget = { col: washer.col, row: washer.row };
      return;
    }

    if (Math.random() < 0.03) {
      startDancing();
      return;
    }

    if (!recordAudio.paused && recordAudio.src && Math.random() < 0.05) {
      playMusicDanceAnim();
      return;
    }

    if (scene === "home" && Math.random() < 0.006) {
      playJumpSplatAnim();
      return;
    }

    const options = [];
    if (row > 0 && !isCellOccupied(col, row - 1)) options.push({ dc: 0, dr: -1, pose: "back" });
    if (row < GRID_SIZE - 1 && !isCellOccupied(col, row + 1)) options.push({ dc: 0, dr: 1, pose: "front" });
    if (col > 0 && !isCellOccupied(col - 1, row)) options.push({ dc: -1, dr: 0, pose: "left" });
    if (col < GRID_SIZE - 1 && !isCellOccupied(col + 1, row)) options.push({ dc: 1, dr: 0, pose: "right" });
    if (!options.length) return;

    const pick = options[Math.floor(Math.random() * options.length)];
    col += pick.dc;
    row += pick.dr;
    mode = "moving";
    setSpriteImg(pick.pose);
    renderPosition();

    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => {
      mode = "idle";
      setSpriteImg("front");
      moveUntilPause = Date.now() + 900 + Math.random() * 2200;
    }, 480);
  }

  setInterval(wanderTick, MOVE_TICK_MS);
  setInterval(applyStatTick, STAT_TICK_MS);

  function mirrorGagTick() {
    if (!state || editMode || scene !== "home") return;
    Object.keys(MIRROR_GAG_IMG).forEach((itemId) => {
      const placed = furniture.find((f) => f.id === itemId);
      if (!placed) return;
      const el = furnLayer.querySelector('.furn-item[data-item-id="' + itemId + '"] img');
      if (!el || el.dataset.gagActive === "1") return;
      if (Math.random() < 0.05) {
        const def = FURN_BY_ID[itemId];
        el.dataset.gagActive = "1";
        el.src = MIRROR_GAG_IMG[itemId];
        setTimeout(() => {
          el.src = def.img;
          el.dataset.gagActive = "0";
        }, 900);
      }
    });
  }
  setInterval(mirrorGagTick, 4000);

  function updatePayoutTimer() {
    if (mode !== "working" || scene !== "factory" || pgStats.classList.contains("hidden")) {
      payoutTimer.classList.add("hidden");
      return;
    }
    const remainingMs = WORK_PAYOUT_MS - (state.workAccumMs || 0);
    const remainingMin = Math.max(1, Math.ceil(remainingMs / 60000));
    payoutTimer.textContent = "⏱ 次の時給まで あと" + remainingMin + "分";
    payoutTimer.classList.remove("hidden");
  }
  setInterval(updatePayoutTimer, 1000);
  setInterval(() => { if (scene === "farm") renderFarmPlots(); }, 15000);

  // occasional mood bubble
  setInterval(() => {
    if (!state || mode === "sleeping" || mode === "acting" || mode === "working") return;
    if (state.hunger < HUNGER_MAX * 0.25) return showEmote("🍗");
    if (state.happy < 25) return showEmote("😞");
    if (state.energy < ENERGY_MAX * 0.2) return showEmote("😴");
    if (Math.random() < 0.5) showEmote(Math.random() < 0.5 ? "😊" : "♪");
  }, 6000);

  // ---------------- init / load ----------------
  (function init() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        state = Object.assign({}, DEFAULT_STATE, saved);
        if (Array.isArray(saved.ownedItems)) {
          // legacy format: array of unique ids -> migrate to {id: count}
          state.ownedItems = {};
          saved.ownedItems.forEach((id) => { state.ownedItems[id] = 1; });
        } else if (saved.ownedItems && typeof saved.ownedItems === "object") {
          state.ownedItems = Object.assign({}, saved.ownedItems);
        } else {
          state.ownedItems = {};
        }
        if (!state.ownedItems.futon) state.ownedItems.futon = 1;
        state.ownedWallpapers = Array.isArray(saved.ownedWallpapers) ? saved.ownedWallpapers.slice() : [];
        state.equippedWallpaper = saved.equippedWallpaper || null;
        applyWallpaper();
        state.ownedFloors = Array.isArray(saved.ownedFloors) ? saved.ownedFloors.slice() : [];
        state.equippedFloor = saved.equippedFloor || null;
        applyFloor();
        state.bgTheme = saved.bgTheme || "yellow";
        applyBgTheme();
        if (!saved.hungerScaleMigrated) {
          state.hunger = Math.min(HUNGER_MAX, (saved.hunger != null ? saved.hunger : 80) * 3);
          state.hungerScaleMigrated = true;
        }
        if (saved.energyScaleMigrated && !saved.energyScaleReverted) {
          // energy was briefly migrated to a 100-point scale by mistake; convert back to 360-point
          state.energy = Math.min(ENERGY_MAX, (saved.energy != null ? saved.energy : 288) * (360 / 100));
          state.energyScaleReverted = true;
        }
        state.ownedFood = (saved.ownedFood && typeof saved.ownedFood === "object") ? Object.assign({}, saved.ownedFood) : {};
        state.ownedOther = (saved.ownedOther && typeof saved.ownedOther === "object") ? Object.assign({}, saved.ownedOther) : {};
        if (state.ownedOther.egg) {
          state.ownedFood.egg = (state.ownedFood.egg || 0) + state.ownedOther.egg;
          delete state.ownedOther.egg;
        }
        state.ownedSeeds = (saved.ownedSeeds && typeof saved.ownedSeeds === "object") ? Object.assign({}, saved.ownedSeeds) : {};
        state.farmPlots = (Array.isArray(saved.farmPlots) && saved.farmPlots.length === 12) ? saved.farmPlots.slice() : new Array(12).fill(null);
        state.farmUnlockedColumns = (saved.farmUnlockedColumns && typeof saved.farmUnlockedColumns === "object") ? Object.assign({}, saved.farmUnlockedColumns) : {};
        poopLoad();
        const poopMultiplier = 1 + poops.length;
        const elapsedMs = state.lastSaved ? Date.now() - state.lastSaved : 0;
        if (!state.hungerZeroSince && state.hunger > 0) {
          const msToZero = (state.hunger / HUNGER_DECAY_PER_TICK) * STAT_TICK_MS;
          if (elapsedMs > msToZero) {
            state.hungerZeroSince = state.lastSaved + msToZero;
            state.hungerPenaltiesApplied = 0;
          }
        }
        const elapsedStatTicks = Math.min(Math.floor(elapsedMs / STAT_TICK_MS), (24 * 3600 * 1000) / STAT_TICK_MS);
        for (let i = 0; i < elapsedStatTicks; i++) {
          const happyLowHungerMult = state.hunger < HUNGER_MAX * 0.15 ? 2 : 1;
          if (state.sleeping) {
            state.energy = clamp(state.energy + SLEEP_ENERGY_PER_TICK, ENERGY_MAX);
            state.hunger = clamp(state.hunger - HUNGER_DECAY_PER_TICK, HUNGER_MAX);
            state.happy = clamp(state.happy - HAPPY_DECAY_PER_TICK * happyLowHungerMult);
          } else if (state.working) {
            if (state.energy > 0) {
              state.workAccumMs = (state.workAccumMs || 0) + STAT_TICK_MS;
              while (state.workAccumMs >= WORK_PAYOUT_MS && state.energy > 0) {
                state.workAccumMs -= WORK_PAYOUT_MS;
                const stats = workStatsForLevel(state.level);
                gainMoney(stats.money);
                state.exp += stats.xp;
                const newWorkLevel = levelFromExp(state.exp);
                if (newWorkLevel > state.level) state.ownedPresents = (state.ownedPresents || 0) + (newWorkLevel - state.level);
                state.level = newWorkLevel;
                state.sessionMoney = (state.sessionMoney || 0) + stats.money;
                state.sessionXp = (state.sessionXp || 0) + stats.xp;
              }
              const energyStats = workStatsForLevel(state.level);
              state.energy = clamp(state.energy - energyStats.energy / TICKS_PER_PAYOUT, ENERGY_MAX);
            }
            state.hunger = clamp(state.hunger - HUNGER_DECAY_PER_TICK * WORK_PLAY_HUNGER_MULTIPLIER, HUNGER_MAX);
            state.happy = clamp(state.happy - HAPPY_DECAY_PER_TICK * happyLowHungerMult);
            if (state.energy <= 0) {
              state.working = false;
              state.workAccumMs = 0;
            }
          } else if (state.playing) {
            state.happy = clamp(state.happy + PLAY_HAPPY_PER_TICK);
            state.energy = clamp(state.energy - PLAY_ENERGY_PER_TICK, ENERGY_MAX);
            state.hunger = clamp(state.hunger - HUNGER_DECAY_PER_TICK * WORK_PLAY_HUNGER_MULTIPLIER, HUNGER_MAX);
            state.playAccumMs = (state.playAccumMs || 0) + STAT_TICK_MS;
            while (state.playAccumMs >= PLAY_PAYOUT_MS) {
              state.playAccumMs -= PLAY_PAYOUT_MS;
              const toyDef = FURN_BY_ID[state.playingToyId];
              const xp = (toyDef && toyDef.playXpPer10Min) || DEFAULT_PLAY_XP;
              state.exp += xp;
              const newPlayLevel = levelFromExp(state.exp);
              if (newPlayLevel > state.level) state.ownedPresents = (state.ownedPresents || 0) + (newPlayLevel - state.level);
              state.level = newPlayLevel;
            }
            if (state.energy <= 0) {
              state.playing = false;
              state.playingToyId = null;
              state.playAccumMs = 0;
            }
          } else {
            state.hunger = clamp(state.hunger - HUNGER_DECAY_PER_TICK, HUNGER_MAX);
            state.happy = clamp(state.happy - HAPPY_DECAY_PER_TICK * happyLowHungerMult);
            state.energy = clamp(state.energy - AWAKE_ENERGY_DECAY_PER_TICK * poopMultiplier, ENERGY_MAX);
          }
        }
        checkHungerPenalty();
        furnLoad();
        // オフライン経過でstate.playingが変化(例:げんき切れで自動終了)しても
        // 家具側の「使用中」フラグが取り残されて2重表示になるのを防ぐ
        furniture.forEach((f) => {
          if (f.playing && !(state.playing && f.id === state.playingToyId)) {
            f.playing = false;
            f.playFrame = 0;
          }
        });
        furnSave();
        const start = findFreeCell(2, 3);
        col = start.col; row = start.row;
        workCol = 2; workRow = 3;
        introCard.classList.add("hidden");
        gameCard.classList.remove("hidden");
        updateBars();
        renderPoops();
        buildFurnTray();
        renderFurniture();
        renderWorkPosition();

        if (state.sleeping && state.energy < ENERGY_MAX) {
          mode = "sleeping";
          const bed = findSleepFurniture();
          if (bed) {
            const def = FURN_BY_ID[bed.id];
            col = bed.col;
            row = bed.row + def.hCells - 1;
          }
          renderPosition();
          enterSleep();
          showScene("home");
        } else if (state.working) {
          mode = "working";
          petAnchor.classList.add("hidden");
          workPetAnchor.classList.remove("hidden");
          setWorkSpriteImg("front");
          showScene("factory");
        } else if (state.playing && furniture.find((f) => f.id === state.playingToyId)) {
          const toy = furniture.find((f) => f.id === state.playingToyId);
          const def = FURN_BY_ID[toy.id];
          col = toy.col;
          row = toy.row + def.hCells - 1;
          mode = "playing";
          petAnchor.classList.add("hidden");
          toy.playing = true;
          renderPosition();
          renderFurniture();
          showScene("home");
          startPlayAnim(toy);
        } else {
          mode = "idle";
          state.sleeping = false;
          state.working = false;
          state.playing = false;
          state.playingToyId = null;
          petAnchor.classList.remove("hidden");
          workPetAnchor.classList.add("hidden");
          renderPosition();
          setSpriteImg("front");
          showScene("home");
          if (saved.sleeping) showToast("すっきり めがさめた！");
        }
        save();
        checkLoginBonus();
        refreshCompanion();
      }
    } catch (e) {}
  })();
})();
</script>
</body>
</html>
